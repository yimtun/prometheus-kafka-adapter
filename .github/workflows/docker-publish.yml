name: Build and Push Multi-Arch Image

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag/ref to build'
        required: true
        default: 'backport/confluent-kafka-v2-1.9.1'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine version
        id: vars
        run: |
          raw="${{ github.event.inputs.ref || github.ref_name }}"
          safe=$(echo "$raw" | tr '/' '-')
          echo "version=$safe" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/prometheus-kafka-adapter:${{ steps.vars.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/prometheus-kafka-adapter:latest
